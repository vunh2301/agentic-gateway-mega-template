id: V5-R061
title: Auto-continue deterministic transitions across slice/review/promote
status: active
category: enforcement
severity: medium
description: |
  After any completable step the agent MUST auto-proceed to the next
  deterministic action WITHOUT asking the user, unless a pause signal
  triggers. Applies to the whole intra-phase chain:

  Slice verify pass + more pending slices
    → next slice auto-start
  Last slice of phase verify pass (workflow.json all slices done)
    → auto-run `/phase-review` (Gate 4.5)
  `/phase-review` produces all-approved artifacts
    → auto-run `/phase-promote` (Gate 5)
  `/phase-promote` completes
    → STOP at new-phase boundary (user decides next phase scope)

  PAUSE signals that override auto-continue:

    1. Current slice has `"pauseAfter": true` in workflow.json
    2. Global `auto_continue.enabled: false` in spec-index.yaml
    3. `auto_continue.phase_review: false` — opt out of auto Gate 4.5
    4. `auto_continue.phase_promote: false` — opt out of auto Gate 5
    5. `/phase-review` verdict changes-requested / rejected
       → user must fix or bypass
    6. Any hook block (check-phase-gate, enforce-slice-order,
       check-review-evidence, enforce-tdd, check-spec, check-spec-coverage,
       check-e2e-real, enforce-verification)
       → can't auto-recover, needs user input
    7. Off-topic drift warning injected
    8. V5-R013 tripped: 3 consecutive fix attempts at the same layer
       → architecture question
    9. User_choice topic triggered (scope prioritization, oversight level,
       external API design)

  Phase boundary is ALWAYS a stop — starting a new phase means choosing
  scope, which is a user_choice per V5-R057. Agent never auto-starts
  phase-N+1.

  Log `auto-continued <step> per V5-R061` in the commit/response so human
  reviewers can trace the decision chain.
rationale: |
  Cheap models (kimi, haiku) default to conservative "ask everything"
  behaviour, which wastes user attention on deterministic transitions.
  For linear sequential plans (workflow.json typical case), the next
  slice is the only valid option — making the ask pure ceremony.
  Explicit opt-in via `pauseAfter` retains oversight for slices that
  genuinely need a decision point (schema migration, external integration,
  material scope shift), without imposing that overhead on every slice.

  Safety nets preserved:
  - Gate 4.5 still mandatory before phase-promote
  - check-phase-gate still blocks out-of-scope writes
  - enforce-slice-order still rejects mismatched commits
  - User can /oh-my-claudecode:cancel any time

enforcement:
  type: hook
  hook: inject-decision-rules
  config: spec-index.yaml#auto_continue
added: 2026-04-14
