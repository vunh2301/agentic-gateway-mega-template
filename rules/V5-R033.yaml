id: V5-R033
title: TDD — exclude patterns for non-testable files
status: active
category: enforcement
severity: low
description: |
  Files matching exclude patterns skip TDD enforcement. Defaults:
    **/*.d.ts, **/index.ts, **/types.ts, **/__generated__/**
  Configurable per project in spec-index.yaml `tdd.exclude:`.
rationale: |
  Type-only files, barrel exports, generated code don't have meaningful
  test coverage. Forcing test files for these creates noise.
enforcement:
  type: hook
  hook: enforce-tdd
added: 2026-04-13
